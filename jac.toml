[project]
name = "TheByteForce"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.25"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "rose"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[byllm.model]
default_model = "${BYLLM_DEFAULT_MODEL:-gemini/gemini-2.5-flash}"

[dependencies]
[dependencies.npm]
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/atkinson-hyperlegible-next" = "latest"
"@fontsource/noto-sans-sinhala" = "latest"
"@fontsource/noto-sans-tamil" = "latest"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]
