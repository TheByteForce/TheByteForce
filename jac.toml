[project]
name = "TheByteForce"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.25"

[jac-shadcn]
style = "nova"
baseColor = "zinc"
theme = "blue"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[byllm.model]
default_model = "${BYLLM_DEFAULT_MODEL:-gemini/gemini-2.5-flash}"

[dependencies]
[dependencies.npm]
"@hugeicons/core-free-icons" = "^4.2.3"
"@hugeicons/react" = "^1.1.9"
"@radix-ui/react-slot" = "^1.3.3"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/atkinson-hyperlegible-next" = "latest"
"@fontsource/noto-sans-sinhala" = "latest"
"@fontsource/noto-sans-tamil" = "latest"
lucide-react = "latest"
leaflet = "latest"
react-leaflet = "5.0.0"

[client.app_meta_data]
title = "CrisisConnect · Flood response desk"
description = "CrisisConnect: one trusted inbox for a flood duty desk. Merges SOS messages into incidents, ranks who to call first, and checks appeals."
theme_color = "#ffffff"
icon = "/static/assets/crisisconnect-mark.svg"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# Admin metrics, distributed traces and aggregated deployment logs.
[scale.monitoring]
enabled = true
walker_metrics = true

[scale.gateway.tracing]
enabled = true

[scale.gateway.logs]
enabled = true
